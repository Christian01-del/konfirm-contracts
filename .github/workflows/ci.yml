name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Real unit tests via soroban-sdk's testutils — no mocked ledger, an
      # in-process simulated one exercising the actual contract logic.
      # testutils is an opt-in feature (see each contract's Cargo.toml) —
      # without it, Address::generate/Env::register don't exist and this
      # fails to even compile.
      - name: Run contract tests
        run: cargo test --all --features testutils

      # Every pub fn must either require auth or be documented Permissionless —
      # see "Authorization convention" in README.md.
      - name: Check pub fn authorization
        run: python3 scripts/check_pub_fn_auth.py

      # The org moved from konfirm-HQ to Konfirm-xyz; the stale name has
      # regressed into links before. Fail the build if it reappears.
      - name: Check for stale konfirm-HQ org references
        run: |
          if git grep -n -I 'konfirm-HQ' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::Found stale 'konfirm-HQ' org reference(s); use 'Konfirm-xyz' instead."
            exit 1
          fi

  audit:
    runs-on: ubuntu-latest
    # rustsec/audit-check publishes its findings as a GitHub Check Run,
    # which needs an explicit grant — the default GITHUB_TOKEN permissions
    # don't include it, and the scan itself was actually succeeding
    # (0 vulnerabilities) while this step failed only on the report step.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
