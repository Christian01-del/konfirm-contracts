name: CI

on:
  push:
    branches: [main]
  pull_request:

# Repository Actions permission hardening (see issue #99):
# The repo-level Actions permissions must not allow arbitrary third-party
# actions. Configure via the API/settings (not code):
#   gh api -X PUT repos/Konfirm-xyz/konfirm-contracts/actions/permissions \
#     -f allowed_actions=selected \
#     -f 'selected_actions={...}'
# Allowlist the actions actually used below:
#   - actions/checkout
#   - dtolnay/rust-toolchain
#   - rustsec/audit-check
# Once the companion mutable-tag-pinning issue is resolved, also enable
# sha_pinning_required=true so only SHA-pinned actions may run.

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b # stable
        with:
          toolchain: stable
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run cargo audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
